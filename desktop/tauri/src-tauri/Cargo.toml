[package]
name = "runicorn-desktop"
version = "0.7.2"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tauri core (v2)
tauri = { version = "2.4", features = [] }
# Tauri shell plugin for sidecar processes
tauri-plugin-shell = "2.0"
# Lightweight HTTP client for readiness checks
ureq = { version = "2", features = ["json"] }
# Open URLs in system default browser
tauri-plugin-opener = "2"
# Native dialogs for error messages
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }
